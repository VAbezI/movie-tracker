name: CI-CD Pipeline

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [test, main]

jobs:
  build-and-test-dev:
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podesi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instaliraj zavisnosti
        run: npm ci

      - name: Pokreni unit testove
        run: npm run test

      - name: Izgradi Docker sliku sa dev tagom
        run: docker build -t movie-tracker:dev-${{ github.sha }} .

  integration-test:
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Podesi Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instaliraj zavisnosti
        run: npm ci

      - name: Pokreni integracione testove
        run: npm run test:integration

      - name: Ocitaj verziju iz package.json
        id: get_version
        run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT

      - name: Izgradi Docker sliku sa test tagom
        run: docker build -t movie-tracker:test-${{ steps.get_version.outputs.version }} .

  release-main:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout koda
        uses: actions/checkout@v4

      - name: Prijava na Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Podesi Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Izgradi i posalji sliku na Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/movie-tracker:latest